<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CN12KH-Travel – Multi-Service Booking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Kantumruy+Pro:wght@300;400;500;600;700&family=Fraunces:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="logo">CN12KH<b>-Travel</b></div>
    <div class="tools">
      <button class="chip" id="themeBtn" aria-label="Theme">🌙</button>
      <div class="seg" id="langSeg"><button data-lang="en" class="on">EN</button><button data-lang="km">KM</button></div>
      <div class="seg" id="curSeg"><button data-cur="USD" class="on">$</button><button data-cur="KHR">៛</button></div>
      <button class="chip bell" aria-label="Notifications">🔔<i class="badge">3</i></button>
      <button class="avatar" id="avatarBtn" aria-label="Account">👤</button>
    </div>
  </header>

  <main id="main">
    <!-- HOME -->
    <section class="view" id="view-home">
      <div class="hero">
        <h1 data-i18n="heroTitle"></h1>
        <p data-i18n="heroSub"></p>
        <div class="search">
          <input id="uSearch" autocomplete="off" data-i18n-ph="searchPh">
          <div class="suggest" id="suggest"></div>
        </div>
      </div>

      <nav class="tabs" id="tabs"></nav>
      <form class="panel" id="svcForm"></form>

      <div class="sec-head"><h2 data-i18n="popular"></h2></div>
      <div class="grid" id="destGrid"></div>

      <button class="row gallery-link" data-view="gallery"><span class="ic">📸</span><div class="grow"><b data-i18n="galleryTitle"></b><br><small data-i18n="gallerySub"></small></div><span>›</span></button>

      <div class="promo">
        <div>
          <h3>☀️ <span data-i18n="summer"></span></h3>
          <p data-i18n="promoText"></p>
        </div>
        <button class="btn light" id="promoBtn" data-i18n="bookNow"></button>
      </div>
    </section>

    <section class="view" id="view-bookings" hidden><h2 data-i18n="bookings"></h2><div id="bookingList"></div></section>
    <section class="view" id="view-wishlist" hidden><h2 data-i18n="wishlist"></h2><div class="grid" id="wishGrid"></div></section>
    <section class="view" id="view-gallery" hidden><div id="galleryRoot"></div></section>
    <section class="view" id="view-admin" hidden><h2 data-i18n="adminPanel"></h2><div id="adminRoot"></div></section>
    <section class="view" id="view-offers" hidden><h2 data-i18n="offers"></h2><div id="offerList"></div></section>
    <section class="view" id="view-profile" hidden><h2 data-i18n="profile"></h2><div class="panel" id="profileBox"></div></section>
  </main>

  <nav class="bottom" id="bottomNav"></nav>
</div>

<!-- Booking modal -->
<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <button class="x" id="closeModal" aria-label="Close">✕</button>
    <div class="steps" id="stepDots"></div>
    <div id="modalBody"></div>
    <div class="m-foot" id="modalFoot"></div>
  </div>
</div>
<div class="overlay" id="authOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true"><button class="x" id="closeAuth" aria-label="Close">✕</button><div id="authBody"></div></div>
</div>
<div class="toasts" id="toasts"></div>

<script src="js/data.js"></script>
<script src="js/i18n-extra.js"></script>
<script src="js/auth.js"></script>
<script src="js/gallery.js"></script>
<script src="js/app.js"></script>
</body>
</html>
